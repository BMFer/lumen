[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-lang"
version = "1.0.0"
description = "A small expression-oriented scripting language with pattern matching and pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lumen = "lumen.cli:main"

[tool.setuptools]
packages = ["lumen"]
